services:
  cb-gateway:
    build:
      context: .
    image: cb-gateway:local
    container_name: cb-gateway
    restart: unless-stopped
    ports:
      - "7801:7801"
      - "18801:18801"
    environment:
      TZ: Asia/Shanghai
      QB_TRAE_LOGIN_HOST: "0.0.0.0"
      QB_TRAE_LOGIN_PORT: "18801"
      QB_TRAE_CALLBACK_BASE: "http://127.0.0.1:18801"
    volumes:
      - ./data:/app/data
    mem_limit: 1536m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7801/login').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
