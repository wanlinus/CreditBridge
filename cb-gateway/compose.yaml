# 网关容器编排。部署位置：~/docker/cb-gateway/，这个目录里只有本文件和 data/。
services:
  cb-gateway:
    image: ghcr.io/wanlinus/creditbridge:latest
    container_name: cb-gateway
    restart: unless-stopped
    ports:
      - "7801:7801"
      # Trae 登录回调。授权页只认环回地址，由插件的 TCP 转发接进来。
      - "18801:18801"
    environment:
      TZ: Asia/Shanghai
      # 容器内必须监听所有网卡，否则端口映射打不进来。
      # 用环境变量而不是改 data/config.json：那个文件在卷里，镜像无法预设。
      QB_HOST: "0.0.0.0"
      QB_TRAE_LOGIN_HOST: "0.0.0.0"
      QB_TRAE_LOGIN_PORT: "18801"
      QB_TRAE_CALLBACK_BASE: "http://127.0.0.1:18801"
    volumes:
      - ./data:/app/data
    # 实测静息约 190 MB。超了让它 OOM 重启，而不是拖垮整台机器。
    mem_limit: 1536m
    healthcheck:
      # 探 /login 而不是 /api/health：后者未认证时回 401，会让容器一直 unhealthy。
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7801/login').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
